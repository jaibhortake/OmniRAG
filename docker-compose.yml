# One command: docker compose up --build   ->  http://localhost:8000
services:
  ollama:
    image: ollama/ollama:0.5.4
    volumes: [ollama:/root/.ollama]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 10

  ollama-pull:  # one-shot: downloads the LLM + vision model into the shared volume
    image: ollama/ollama:0.5.4
    depends_on: { ollama: { condition: service_healthy } }
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["sh", "-c", "ollama pull qwen2.5:3b && ollama pull moondream"]
    volumes: [ollama:/root/.ollama]

  omnirag:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["8000:8000"]
    depends_on: { ollama-pull: { condition: service_completed_successfully } }
    environment:
      OMNIRAG_OLLAMA_HOST: http://ollama:11434
      OMNIRAG_PROVIDERS: real
    volumes: [data:/app/backend/data, models:/models]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes: { ollama: {}, data: {}, models: {} }
